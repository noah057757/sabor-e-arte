 <!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Sabor e Arte</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>🍽️ Sabor e Arte</h1>

    <p>Finalizar Pedido</p>

</header>



<section class="checkout">


    <h2>🧾 Seus dados</h2>


    <form>


        <label>
            Nome:
        </label>

        <input 
        type="text" 
        placeholder="Digite seu nome"
        required>


        <label>
            Telefone:
        </label>

        <input 
        type="tel" 
        placeholder="(00) 00000-0000"
        required>


        <label>
            Endereço:
        </label>

        <textarea 
        placeholder="Rua, número, bairro"
        required></textarea>



        <label>
            Forma de pagamento:
        </label>


        <select>

            <option>
                Pix
            </option>

            <option>
                Cartão
            </option>

            <option>
                Dinheiro
            </option>

        </select>



        <button type="submit">
            Confirmar Pedido 🍔
        </button>


    </form>


</section>



<footer>

<p>
© 2026 Sabor e Arte
</p>

</footer>



</body>

</html>
